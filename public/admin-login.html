<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Lawson Mobile Mechanic Admin Login</title>
  <link rel="icon" type="image/jpeg" href="assets/lawson-logo-original.jpeg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <main class="admin-main">
    <section class="admin-hero">
      <div class="container admin-hero__content">
        <img class="admin-logo" src="assets/lawson-logo-original.jpeg" alt="Lawson Mobile Mechanic logo">
        <span class="eyebrow">Restricted Lawson access</span>
        <h1>Lawson Admin Login</h1>
        <p>Sign in to review service requests and manage Lawson Mobile Mechanic bookings.</p>
      </div>
    </section>

    <section class="admin-section">
      <div class="container">
        <div class="admin-panel admin-panel--narrow">
          <div class="admin-panel__header">
            <div>
              <h2>Sign In</h2>
              <p>Use your Lawson admin credentials to access the dashboard.</p>
            </div>
          </div>

          <form class="admin-login-form" id="adminLoginForm" novalidate>
            <div class="field">
              <label for="adminUsername">Username or email</label>
              <input id="adminUsername" name="username" type="text" autocomplete="username" required minlength="3" maxlength="120">
            </div>
            <div class="field">
              <label for="adminPassword">Password</label>
              <input id="adminPassword" name="password" type="password" autocomplete="current-password" required maxlength="128">
            </div>
            <button class="btn btn-primary" type="submit">Sign In</button>
          </form>

          <div class="admin-login-divider" id="googleLoginDivider" hidden><span>or</span></div>
          <section class="admin-google-login" id="googleLoginSection" hidden>
            <div class="admin-google-login__header">
              <h3>Continue with Google</h3>
              <p>Use an authorized Lawson admin Google account.</p>
            </div>
            <div class="admin-google-login__button" id="googleLoginButton"></div>
            <p class="admin-google-login__hint" id="googleLoginHint">Google sign-in is loading.</p>
          </section>

          <div class="admin-status" id="adminLoginStatus" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="admin-login.js"></script>
</body>
</html>
